name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /Dobratimia/

      - name: Prepare Pages files
        run: |
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          force_orphan: true

      - name: Point Pages at gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f source[branch]=gh-pages \
            -f source[path]=/
          status=$?
          if [ $status -ne 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/
          fi
          gh api "repos/${{ github.repository }}/pages" || true
